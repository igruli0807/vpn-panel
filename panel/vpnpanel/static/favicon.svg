<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1b1140"/>
      <stop offset="60%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#04010e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Космос -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#space)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.35"/>

  <!-- Звёзды -->
  <circle cx="12" cy="14" r="0.9" fill="#e9d5ff" opacity="0.9"/>
  <circle cx="52" cy="18" r="0.7" fill="#a5f3fc" opacity="0.8"/>
  <circle cx="48" cy="48" r="0.8" fill="#fbcfe8" opacity="0.8"/>
  <circle cx="14" cy="50" r="0.7" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="32" cy="8" r="0.6" fill="#ffffff" opacity="0.6"/>

  <!-- Внешнее свечение портала -->
  <circle cx="32" cy="32" r="22" fill="url(#glow)"/>

  <!-- Портал: два эллипса (иллюзия тора) -->
  <ellipse cx="32" cy="32" rx="14" ry="18" fill="none"
           stroke="url(#ring)" stroke-width="3.5"/>
  <ellipse cx="32" cy="32" rx="8" ry="12" fill="none"
           stroke="#67e8f9" stroke-width="1.2" opacity="0.7"/>

  <!-- Вращение кольца-искры -->
  <ellipse cx="32" cy="32" rx="14" ry="18" fill="none"
           stroke="#f0abfc" stroke-width="1.6"
           stroke-dasharray="6 40" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
      from="0 32 32" to="360 32 32" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Точка А (слева) -->
  <circle cx="10" cy="32" r="2.5" fill="#22d3ee"/>

  <!-- Точка Б (справа) -->
  <circle cx="54" cy="32" r="2.5" fill="#f472b6"/>

  <!-- Пакет данных, летящий сквозь портал -->
  <rect x="16" y="29.5" width="9" height="5" rx="2.5" fill="url(#packet)">
    <animate attributeName="x" values="8;40;8"
             dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0;1"
             dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Вспышка при входе в портал -->
  <circle cx="32" cy="32" r="0" fill="#ffffff" opacity="0">
    <animate attributeName="r" values="0;0;4;0;0" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
